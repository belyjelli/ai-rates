# airates collector on hklab. Deploy with deploy/hklab/deploy.sh from the repository root.
# Secrets (DATABASE_URL, ...) live in deploy/hklab/.env on the server only.
name: airates

services:
  # The Go collector (apps/collector-go). Cloudflare is unaffected: the worker there stays Bun and
  # reads Postgres through Hyperdrive. This service exists only on hklab.
  #
  # THE COLLECTOR as of 2026-09-15. Covers all 56 venues — the same 56 the Bun collector reported
  # live — each adapter pinned to the same __fixtures__ JSON its TypeScript twin asserts on.
  #
  # The Bun collector it replaced was removed from the repository on 2026-09-24; its last image,
  # airates-collector:latest, may still sit on the server but nothing here can start it.
  #
  # IT RUNS EVERYTHING THE BUN SERVICE RAN, from the go-jobs-port build on: migrations at boot, venue
  # rows from packages/venues/catalog.json, the history/backfill/tier/liquidation loops, the scheduled
  # jobs and stale-venue alerts (ALERT_WEBHOOK_URL in .env). The first cutover build ran snapshot loops
  # only, which froze every derived figure on the site; see plans/go-collector.md §10.
  #
  # WHAT IS STILL UNPROVEN, and what to watch on the first day: whether 56 venues fit inside a 60 s
  # cycle on `cpus: 1.0` with the side loops and jobs beside them (the nightly ranking replays every
  # candidate pair), where memory settles against GOMEMLIMIT, and every TimescaleDB-specific
  # behaviour (hypertable routing, compression, retention) under real write load — none of which the
  # throwaway Postgres in the integration tests could exercise.
  #
  # ENDPOINTS ARE NOT AT PARITY: the Bun collector served /health and /v1/latest; this serves
  # /health only. Nothing consumes /v1/latest (the worker reads Postgres through Hyperdrive), so it
  # is an operator convenience that is gone, not a dependency.
  collector-go:
    build:
      context: ../..
      dockerfile: apps/collector-go/Dockerfile
    image: airates-collector-go:latest
    container_name: airates-collector-go
    restart: unless-stopped
    env_file: .env
    environment:
      HEALTH_PORT: "8080"
      # A soft limit under mem_limit, so pressure becomes GC work rather than an OOM kill. The Bun
      # collector hit its hard cap 1,508 times in one boot and restarted every ~50 minutes.
      GOMEMLIMIT: "900MiB"
      # Empty means ALL 56 registered venues — main.go's selected() returns the whole registry when
      # the list is empty. This must stay the only writer: a second collector would collide on every
      # venue.
      COLLECT_VENUES: ""
    ports:
      # 20090 is "the collector's port": deploy.sh health-checks it and README documents it.
      - "127.0.0.1:20090:8080"
    networks:
      - postgres
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Existing network shared with timescaledb_container (/srv/postgres/db_compose.yml).
  postgres:
    name: postgres_postgres
    external: true
